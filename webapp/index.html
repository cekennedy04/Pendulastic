<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pendulastic</title>
<link rel="stylesheet" href="./src/app.css">
<body>
  <div id="banner">research capture only &mdash; not validated</div>
  <button id="start">Start trial</button>
  <div id="guide">tap Start</div>
  <dl id="gates">
    <div class="gate">
      <dt>hold (motion)</dt><dd id="calm">&mdash;</dd>
    </div>
    <div class="gate">
      <dt>drift (pose)</dt><dd id="drift">&mdash;</dd>
    </div>
  </dl>
  <button id="stop" hidden>Stop</button>
  <div id="waveform-wrap" hidden>
    <canvas id="waveform"></canvas>
    <p id="waveform-range" class="waveform-caption"></p>
    <div id="waveform-legend">
      <span class="legend-item"><span class="swatch swatch-trace"></span>angle</span>
      <span class="legend-item"><span class="swatch swatch-neutral"></span>neutral</span>
      <span class="legend-item"><span class="swatch swatch-release"></span>release</span>
      <span class="legend-item"><span class="swatch swatch-peak"></span>&#9650; peak</span>
      <span class="legend-item"><span class="swatch swatch-trough"></span>&#9660; trough</span>
    </div>
  </div>
  <table id="result" hidden></table>
  <script type="module" src="./src/app.js"></script>
</body>
