name: ci
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned deliberately, and it is `-D warnings` below that makes the pin
      # necessary: arming the lint gate makes clippy's lint SET part of the
      # gate, and every Rust release ships new lints. Unpinned, this job fails
      # on release days for reasons that have nothing to do with this repo --
      # exactly the "fails for the wrong reason" problem the gate exists to
      # end. This bit immediately: the runner moved to 1.99.0 and flagged a
      # `chunks_exact` in a test that 1.97.0 does not mention.
      #
      # Raise this version deliberately, with any new lint fixes in the same
      # commit, so the move is a decision rather than a surprise.
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - run: rustup default 1.99.0
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --manifest-path mobile-imu-core/Cargo.toml
      # -D warnings is what makes this a gate. Without it the step reported
      # lints and exited 0, so the pipeline read as enforcing a lint standard
      # it did not enforce -- and the crate had drifted to 12 of them while the
      # instrument-validation plan's Verification Contract still described it
      # as "kept at zero warnings deliberately". The existing sites are
      # suppressed individually, each with the reason at the site; two of them
      # are cases where clippy's suggested rewrite would be wrong.
      - run: cargo clippy --manifest-path mobile-imu-core/Cargo.toml --all-targets -- -D warnings
      # Proves the veneer compiles for the target that actually ships.
      - run: cargo build --manifest-path mobile-imu-core/Cargo.toml
              --release --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Pinned rather than relying on the runner image's bundled Node: the
      # last step of this job executes the LabVIEW Formula Node text as
      # JavaScript, so a runner without node would skip the only check that
      # the rig's model and the Python model agree.
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # matplotlib and pandas are not optional here, however odd that reads for
      # a scoring test: pendulastic_pt_score imports both at module scope (and
      # calls matplotlib.use("Agg") there), so the production scorer cannot be
      # imported without them. Their absence is why this job failed even after
      # the import path was fixed. scikit-learn is the same story for
      # mas_validation. Each was found by running these exact steps against a
      # venv holding only the previous line's packages, not by reading imports.
      - run: pip install numpy scipy pytest matplotlib pandas scikit-learn
      # Guards a SILENT failure: a malformed export replays as an unscorable
      # trial, or worse, as a plausible wrong one.
      #
      # Invoked as `python -m pytest`, not the bare `pytest` script. The bare
      # script does not put the current directory on sys.path, so this step
      # failed for 79 consecutive runs with "No module named
      # 'imu_calibration_tuner'" while the same command passed locally under
      # `python -m pytest`. tests/conftest.py now bootstraps the repo root too,
      # so either form works; this one states the dependency rather than
      # relying on it.
      - run: python -m pytest tests/test_web_export_contract.py -q
      # The scoring and reporting suite -- the files the instrument-validation
      # plan names in its own Verification Contract, which until now it had to
      # note were "run locally and the result stated in the change that makes
      # it" because CI gated exactly one file.
      #
      # test_optitrack_marker_angle.py is gated because it is how this list
      # would have caught its own gap. The file imports participant_paths and
      # sat broken on main for weeks -- the module was added by 126a117, which
      # never merged, while the test that needs it arrived via d5e6291, which
      # did. Nothing noticed, because the file was not in this list and
      # `pytest tests/` is not what CI runs.
      #
      # test_pt_zone_parity.py is gated because it is the ONLY thing keeping
      # the Python and Rust verdict classifiers from drifting apart. pt_zone
      # exists in both -- mobile-imu-core/src/pt_score.rs and
      # pendulastic_pt_score.py -- and the project already shipped for a while
      # with two threshold systems that disagreed on every trial because
      # nothing compared them. An ungated parity test would not have caught
      # that either.
      #
      # Deliberately a file list and not `pytest tests/`: the GUI suite needs a
      # display, and three non-GUI files have failures unrelated to scoring
      # (see the changeset notes). Widening this is a follow-up, not a silent
      # inclusion.
      - run: |
          python -m pytest -q \
            tests/test_pt_score.py \
            tests/test_pt_report_common.py \
            tests/test_mas_validation.py \
            tests/test_spasticity_grouping.py \
            tests/test_pt_zone_parity.py \
            tests/test_optitrack_marker_angle.py

      # The emulator model. `neuromech/tests/` is its own directory, so
      # `pytest tests/` would never have reached it however far that list
      # widened. Two things are gated here and both are load-bearing:
      #
      #   test_pendulum_sim_reference.py  the integrator and the delay line,
      #     checked before any biomechanical parameter -- a wrong integrator
      #     is otherwise indistinguishable from a wrong parameter.
      #   test_model_rt_ports.py          that `Params()` is still the
      #     validated reference. Four mechanisms were added 2026-10-26 and
      #     every one of them defaults to zero; a regression that turned one
      #     on by default would change the published model silently, and the
      #     scenario library would just quietly grade differently.
      - run: python -m pytest -q neuromech/tests/

      # The LabVIEW port. `model_step_formula_node.txt` is the text that gets
      # pasted into the rig's Formula Node, executed here as JavaScript
      # against vectors generated from the Python twin. Without this, the
      # Python model and the thing the motor actually runs can diverge and
      # nothing says so until a run on hardware looks wrong.
      - run: node neuromech/labview/verify_formula_node.js

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      # webapp/tests/worker.test.js loads the real wasm artifact under
      # webapp/src/wasm/. That directory is generated and gitignored -- it is
      # not in the checkout at all -- so building it here is not a
      # belt-and-braces guard against staleness, it is the only way the tests
      # can run. Which is the point: what CI tests is necessarily a fresh build
      # of mobile-imu-core/src/, so bindings that lag the Rust source cannot
      # exist to be detected. This replaces an earlier byte-exact drift check
      # against committed artifacts, which could never have passed: the .wasm
      # embeds the building machine's cargo registry path, its path
      # separators, and a rustc version string.
      # Locally the same two steps are `npm run build:wasm` (from webapp/).
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --manifest-path mobile-imu-core/Cargo.toml
              --release --target wasm32-unknown-unknown

      # wasm-bindgen-cli must match the wasm-bindgen crate version resolved
      # in Cargo.lock -- a mismatch produces spurious output differences and,
      # worse, bindings the compiled .wasm doesn't actually agree with.
      - name: Install pinned wasm-bindgen-cli
        run: |
          set -euo pipefail
          WBG_VERSION=$(grep -A1 'name = "wasm-bindgen"' mobile-imu-core/Cargo.lock | grep '^version' | head -1 | cut -d '"' -f2)
          echo "Resolved wasm-bindgen crate version: $WBG_VERSION"
          curl --retry 3 --retry-delay 2 -fL -o wbg.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG_VERSION}/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wbg.tar.gz
          mkdir -p "$HOME/.local/bin"
          cp "wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/wasm-bindgen"
          chmod +x "$HOME/.local/bin/wasm-bindgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build wasm bindings from source
        run: |
          set -euo pipefail
          wasm-bindgen --version
          wasm-bindgen mobile-imu-core/target/wasm32-unknown-unknown/release/mobile_imu_core.wasm \
            --out-dir webapp/src/wasm --target web

      # webapp/package.json intentionally uses default "node --test"
      # discovery (a bare "tests/" argument is misparsed as a CommonJS
      # module specifier on Node 24 and throws before anything runs).
      # Confirm default discovery still finds the full known-good count
      # rather than silently running a subset.
      - name: Run webapp tests and verify discovery has not lost files
        working-directory: webapp
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/webapp-test-output.log
          TESTS_COUNT=$(grep -oE '(ℹ|#) tests [0-9]+' /tmp/webapp-test-output.log | grep -oE '[0-9]+' | tail -1 || true)
          PASS_COUNT=$(grep -oE '(ℹ|#) pass [0-9]+' /tmp/webapp-test-output.log | grep -oE '[0-9]+' | tail -1 || true)
          echo "Discovered tests: ${TESTS_COUNT:-unknown}, passed: ${PASS_COUNT:-unknown}"
          # A FLOOR, not an exact count. The check exists to catch `node --test`
          # silently discovering fewer files than it should, so it must fail
          # when the count DROPS and must not fail merely because tests were
          # added. The exact-count form this replaces was written when the
          # suite had 108 tests and went stale the moment it grew; it has been
          # failing on a suite of 392 passing tests, which is a chore rather
          # than a canary. Raise the floor when the suite grows enough that a
          # regression could hide under it.
          MIN_TESTS=392
          if [ -z "${TESTS_COUNT:-}" ] || [ -z "${PASS_COUNT:-}" ]; then
            echo "::error::Could not parse test counts from 'node --test' output. The reporter format may have changed -- fix the parse, do not delete the check."
            exit 1
          fi
          if [ "$TESTS_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Default 'node --test' discovery found only ${TESTS_COUNT} tests, below the floor of ${MIN_TESTS}. Discovery is finding fewer test files than the known-good baseline -- investigate, don't assume this is fine."
            exit 1
          fi
          if [ "$PASS_COUNT" != "$TESTS_COUNT" ]; then
            echo "::error::${TESTS_COUNT} tests discovered but only ${PASS_COUNT} passed."
            exit 1
          fi
