name: ci
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --manifest-path mobile-imu-core/Cargo.toml
      - run: cargo clippy --manifest-path mobile-imu-core/Cargo.toml --all-targets
      # Proves the veneer compiles for the target that actually ships.
      - run: cargo build --manifest-path mobile-imu-core/Cargo.toml
              --release --target wasm32-unknown-unknown

  export-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The test imports imu_calibration_tuner -> pendulastic_pt_score, which
      # imports pandas and matplotlib at module level. Verified in a fresh venv:
      # numpy+scipy+pytest alone fails at collection; adding these two passes.
      - run: pip install numpy scipy pandas matplotlib pytest
      # Guards a SILENT failure: a malformed export replays as an unscorable
      # trial, or worse, as a plausible wrong one.
      - run: pytest tests/test_web_export_contract.py -q

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      # webapp/tests/worker.test.js loads the real wasm artifact under
      # webapp/src/wasm/. That directory is generated and gitignored -- it is
      # not in the checkout at all -- so building it here is not a
      # belt-and-braces guard against staleness, it is the only way the tests
      # can run. Which is the point: what CI tests is necessarily a fresh build
      # of mobile-imu-core/src/, so bindings that lag the Rust source cannot
      # exist to be detected. This replaces an earlier byte-exact drift check
      # against committed artifacts, which could never have passed: the .wasm
      # embeds the building machine's cargo registry path, its path
      # separators, and a rustc version string.
      # Locally the same two steps are `npm run build:wasm` (from webapp/).
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --manifest-path mobile-imu-core/Cargo.toml
              --release --target wasm32-unknown-unknown

      # wasm-bindgen-cli must match the wasm-bindgen crate version resolved
      # in Cargo.lock -- a mismatch produces spurious output differences and,
      # worse, bindings the compiled .wasm doesn't actually agree with.
      - name: Install pinned wasm-bindgen-cli
        run: |
          set -euo pipefail
          WBG_VERSION=$(grep -A1 'name = "wasm-bindgen"' mobile-imu-core/Cargo.lock | grep '^version' | head -1 | cut -d '"' -f2)
          echo "Resolved wasm-bindgen crate version: $WBG_VERSION"
          curl --retry 3 --retry-delay 2 -fL -o wbg.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${WBG_VERSION}/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar xzf wbg.tar.gz
          mkdir -p "$HOME/.local/bin"
          cp "wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/wasm-bindgen"
          chmod +x "$HOME/.local/bin/wasm-bindgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build wasm bindings from source
        run: |
          set -euo pipefail
          wasm-bindgen --version
          wasm-bindgen mobile-imu-core/target/wasm32-unknown-unknown/release/mobile_imu_core.wasm \
            --out-dir webapp/src/wasm --target web

      # webapp/package.json intentionally uses default "node --test"
      # discovery (a bare "tests/" argument is misparsed as a CommonJS
      # module specifier on Node 24 and throws before anything runs).
      # Confirm default discovery still finds the full known-good count
      # rather than silently running a subset.
      - name: Run webapp tests and verify discovery has not lost files
        working-directory: webapp
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/webapp-test-output.log
          TESTS_COUNT=$(grep -oE '(ℹ|#) tests [0-9]+' /tmp/webapp-test-output.log | grep -oE '[0-9]+' | tail -1 || true)
          PASS_COUNT=$(grep -oE '(ℹ|#) pass [0-9]+' /tmp/webapp-test-output.log | grep -oE '[0-9]+' | tail -1 || true)
          echo "Discovered tests: ${TESTS_COUNT:-unknown}, passed: ${PASS_COUNT:-unknown}"
          # A FLOOR, not an exact count. The check exists to catch `node --test`
          # silently discovering fewer files than it should -- so it must fail
          # when the count DROPS, and must not fail merely because tests were
          # added. The exact-count form this replaces went stale the moment four
          # trials-view test files landed, turning a discovery canary into a
          # chore that fails every honest addition. Raise MIN_TESTS when the
          # suite grows enough that a regression could hide under the old floor.
          MIN_TESTS=179
          if [ -z "${TESTS_COUNT:-}" ] || [ -z "${PASS_COUNT:-}" ]; then
            echo "::error::Could not parse test counts from 'node --test' output. The reporter format may have changed -- fix the parse, do not delete the check."
            exit 1
          fi
          if [ "$TESTS_COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Default 'node --test' discovery found only ${TESTS_COUNT} tests, below the floor of ${MIN_TESTS}. Discovery is finding fewer test files than the known-good baseline -- investigate, don't assume this is fine."
            exit 1
          fi
          if [ "$PASS_COUNT" != "$TESTS_COUNT" ]; then
            echo "::error::${TESTS_COUNT} tests discovered but only ${PASS_COUNT} passed."
            exit 1
          fi
